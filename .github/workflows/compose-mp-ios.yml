name: Compose MP · iOS

# iOS build on an Apple-silicon macOS runner (Xcode preinstalled). Builds the
# Xray-core gomobile xcframework and the hev-socks5-tunnel static lib (for the
# Kotlin/Native cinterop), then builds the app for the iOS Simulator (unsigned).

on:
  push:
    branches: [master, claude/ios-alternatives-research-l8ebbb]
    paths: ['compose-multiplatform/**', '.github/workflows/compose-mp-ios.yml']
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14   # Apple silicon; iosSimulatorArm64 slice
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # hev-socks5-tunnel

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          # Go 1.23: wlynxg/anet (an Xray-core dep) uses //go:linkname on
          # net.zoneCache, which Go 1.24 locked down.
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      # macOS runners also ship an Android SDK; force the Kotlin build to the iOS
      # targets only (the Xcode pre-build script calls ./gradlew without flags, so
      # set it in gradle.properties).
      - name: Restrict Kotlin targets to iOS
        working-directory: compose-multiplatform
        run: printf '\nenableAndroid=false\nenableIos=true\n' >> gradle.properties

      - name: Build Xray-core xcframework (gomobile)
        working-directory: compose-multiplatform/iosApp/PacketTunnel/xray-go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./build-xray-apple.sh

      - name: Build hev-socks5-tunnel iOS simulator static lib (for cinterop)
        run: |
          cd "$GITHUB_WORKSPACE/hev-socks5-tunnel"
          git submodule update --init --recursive
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          # hev uses a Makefile (not CMake). The `static` target builds
          # bin/libhev-socks5-tunnel.a (adding -DENABLE_LIBRARY itself, dropping
          # main()) and builds the third-part deps (lwip/hev-task-system/yaml) via
          # its tp-static prerequisite.
          make -j"$(sysctl -n hw.ncpu)" static \
            CC="$(xcrun --sdk iphonesimulator -f clang)" \
            CFLAGS="-arch arm64 -isysroot $SDK -mios-simulator-version-min=15.0"
          echo "--- produced archives ---"; find . -name '*.a'
          # The tunnel .a holds only hev's own objects; the deps stay in separate
          # archives. Merge all four into one fat archive so the Kotlin/Native
          # cinterop (a single staticLibraries entry) resolves every symbol at the
          # final app link.
          DEST="$GITHUB_WORKSPACE/compose-multiplatform/composeApp/src/nativeInterop/cinterop/libs"
          mkdir -p "$DEST"
          libtool -static -o "$DEST/libhev-socks5-tunnel.a" \
            $(find . \( -name 'libhev-socks5-tunnel.a' -o -name 'liblwip.a' \
                        -o -name 'libhev-task-system.a' -o -name 'libyaml.a' \))
          test -f "$DEST/libhev-socks5-tunnel.a"
          lipo -info "$DEST/libhev-socks5-tunnel.a" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Xcode project & build (iOS Simulator, unsigned)
        working-directory: compose-multiplatform/iosApp
        run: |
          xcodegen generate
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
