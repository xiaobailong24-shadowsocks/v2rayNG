name: Compose MP · verify

# Fast, reliable checks for the Kotlin/Compose Multiplatform client under
# compose-multiplatform/. Runs on GitHub infra where Google Maven is reachable,
# so it compile-verifies the entire shared Compose UI (not possible in the
# restricted dev sandbox) and runs the core unit tests.

on:
  push:
    branches: [master, claude/ios-alternatives-research-l8ebbb]
    paths: ['compose-multiplatform/**', '.github/workflows/compose-mp-verify.yml']
  pull_request:
    paths: ['compose-multiplatform/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: compose-multiplatform

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # GitHub runners ship an Android SDK (ANDROID_HOME set), which would flip the
      # auto-detected Android target on; force desktop-only for this check.
      - name: Core unit tests (Kotlin Multiplatform / JVM)
        run: ./gradlew :core:jvmTest -PenableAndroid=false -PenableIos=false --stacktrace

      - name: Compile shared Compose UI (desktop)
        run: ./gradlew :composeApp:compileKotlinDesktop -PenableAndroid=false -PenableIos=false --stacktrace

      # Offscreen Skia render of the real shared UI (ImageComposeScene — no
      # display server needed). The PNG artifact is a visual check of what ships.
      - name: Render UI screenshot (headless)
        run: ./gradlew :composeApp:screenshot -PenableAndroid=false -PenableIos=false --stacktrace

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: compose-multiplatform/composeApp/app-preview.png
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: compose-multiplatform/core/build/reports/tests/
          if-no-files-found: ignore
