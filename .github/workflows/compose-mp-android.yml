name: Compose MP · Android

# Full Android build. Downloads the prebuilt libv2ray.aar (Xray-core) from the
# AndroidLibXrayLite release matching the submodule tag — same as v2rayNG —
# builds libhev-socks5-tunnel.so from the submodule, then assembles the APK with
# the native core. No Go toolchain required.

on:
  push:
    branches: [master, claude/ios-alternatives-research-l8ebbb]
    paths: ['compose-multiplatform/**', '.github/workflows/compose-mp-android.yml']
  workflow_dispatch:

env:
  NDK_VERSION: '27.2.12479018'
  ENABLE_ANDROID: 'true'   # puts AGP on the buildscript classpath (root build.gradle.kts)

defaults:
  run:
    working-directory: compose-multiplatform

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # AndroidLibXrayLite + hev-socks5-tunnel

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform, NDK + CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native artifacts (download libv2ray.aar + build hev .so)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: ./scripts/build-native-android.sh

      - name: Assemble debug APK (with native core)
        run: ./gradlew :composeApp:assembleDebug -PwithNative=true -PenableAndroid=true -PenableIos=false --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: compose-multiplatform/composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn
