[versions]
kotlin = "2.4.0"
compose = "1.11.1"
# Compose Multiplatform decouples some artifact versions from the plugin version.
# These are the exact versions the Compose 1.11.1 Gradle plugin resolves
# (from its ComposeBuildConfig): material3 1.9.0, and material-icons-extended is
# pinned at 1.7.3 upstream. Kept explicit so the deprecated `compose.*` DSL
# aliases can be dropped in favour of direct dependencies.
composeMaterial3 = "1.9.0"
composeIcons = "1.7.3"
agp = "8.7.3"
coroutines = "1.11.0"
serialization = "1.11.0"
androidCompileSdk = "35"
androidMinSdk = "24"
androidTargetSdk = "35"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Compose Multiplatform libraries (direct dependencies; replaces the deprecated
# compose.* Gradle DSL aliases). The compose.desktop.* accessors are not
# deprecated and remain in build scripts.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeIcons" }
compose-components-uiToolingPreview = { module = "org.jetbrains.compose.components:components-ui-tooling-preview", version.ref = "compose" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
# Android plugins are declared here for version resolution only. They are applied
# lazily via pluginManager.apply(...) so environments without the Android SDK /
# Google Maven access (which serve AGP) are never forced to resolve them.
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
