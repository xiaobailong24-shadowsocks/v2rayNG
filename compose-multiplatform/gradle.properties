kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# Android (only consumed when the Android target is enabled)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Target toggles.
#   enableAndroid : auto  -> enabled when an Android SDK is detected
#                   true/false to force
#   enableIos     : auto  -> enabled on macOS hosts
#                   true/false to force
enableAndroid=auto
enableIos=auto
