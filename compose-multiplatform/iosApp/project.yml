# XcodeGen spec. Run `xcodegen generate` in this directory to produce
# iosApp.xcodeproj, then open it in Xcode. Regenerating is reproducible and keeps
# the project definition reviewable in git (no giant .pbxproj to merge).
name: iosApp
options:
  bundleIdPrefix: com.v2ray.compose
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    # Set your Apple developer team so signing works:
    DEVELOPMENT_TEAM: ""

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - target: PacketTunnel
      # Kotlin/Compose shared framework. Pre-built into
      # composeApp/build/xcode-frameworks/ before xcodebuild (CI workflow, or
      # locally: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64) so both
      # this target and the PacketTunnel extension resolve `import ComposeApp`. It's
      # a static framework (isStatic=true) → linked in, not embedded.
      - framework: ../composeApp/build/xcode-frameworks/ComposeApp.framework
        embed: false
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.v2ray.compose
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - xray-go        # Go sources, built separately into Xraybridge.xcframework
    dependencies:
      # Xray-core (gomobile) — build with PacketTunnel/xray-go/build-xray-apple.sh
      - framework: PacketTunnel/Xraybridge.xcframework
        embed: true
      # Shared Kotlin/Native framework: provides IosTun2socks, and links
      # hev-socks5-tunnel via cinterop (no Swift bridging header needed).
      - framework: ../composeApp/build/xcode-frameworks/ComposeApp.framework
        embed: false
    info:
      path: PacketTunnel/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.v2ray.compose.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
